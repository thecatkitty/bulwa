name: Build

on:
  workflow_dispatch:
  push:
    tags: [REL-*]

env:
    MSTORSJO_REL: 20261006

jobs:
  Build:
    name: Build for ${{ matrix.crt }}-${{ matrix.target }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [i386, i486, i586]
        crt: [crtdll, msvcrt]

    steps:
      - name: Checkout BULWA
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Checkout LLVM-MinGW
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          repository: mstorsjo/llvm-mingw
          ref: ${{ env.MSTORSJO_REL }}
          path: llvm-mingw

      - name: Patch LLVM-MinGW build script
        run: cd llvm-mingw && git apply ../patches/llvm-mingw-apply-patches.patch

      - name: Fetch LLVM-MinGW distribution
        uses:  dsaltares/fetch-gh-release-asset@1.1.1
        with:
          repo: mstorsjo/llvm-mingw
          version: tags/${{ env.MSTORSJO_REL }}
          file: llvm-mingw-${{ env.MSTORSJO_REL }}-msvcrt-ubuntu-22.04-x86_64.tar.xz
          target: llvm-mingw-dst.tar.xz

      - name: Extract LLVM-MinGW distribution
        run: tar xf llvm-mingw-dst.tar.xz

      - name: Build MinGW-w64 libraries
        env:
          ARCHS: i686
          CRT_CONFIG_FLAGS: CFLAGS=-march=${{ matrix.target }}
        run: |
          export PATH=${{ github.workspace }}/llvm-mingw-${{ env.MSTORSJO_REL }}-msvcrt-ubuntu-22.04-x86_64/bin:$PATH
          cd llvm-mingw
          ./build-mingw-w64.sh \
            --with-default-win32-winnt=0x400 \
            --with-default-msvcrt=${{ matrix.crt }} \
            --enable-cfguard \
            out

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: libs-${{ matrix.crt }}-${{ matrix.target }}
          path: llvm-mingw/out/i686-w64-mingw32/lib

      - name: Upload headers
        if: matrix.target == 'i386'
        uses: actions/upload-artifact@v4
        with:
          name: headers-${{ matrix.crt }}
          path: llvm-mingw/out/generic-w64-mingw32/include


  Release:

    runs-on: ubuntu-latest
    needs: Build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Fetch build output
        uses: actions/download-artifact@v4

      - name: Prepare archives
        run: |
          for crt in crtdll msvcrt; do
            mkdir -p bulwa-$crt/include
            mkdir -p bulwa-$crt/lib/{i386,i486,i586}

            cp -a headers-$crt/. bulwa-$crt/include/

            for arch in i386 i486 i586; do
              cp -a libs-$crt-$arch/. bulwa-$crt/lib/$arch/
            done

            cd bulwa-$crt
            zip -r ../bulwa-${{ github.ref_name }}-$crt.zip *
            cd ..
          done

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          files: bulwa-${{ github.ref_name }}-*.zip
